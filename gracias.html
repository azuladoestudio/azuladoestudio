<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Gracias! · Azulado Estudio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17143D">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Cierre del cuestionario: la llama que la persona fue encendiendo, ya prendida del todo */
    body {
      background:
        radial-gradient(70% 55% at 50% 108%, rgba(140,82,232,.55), transparent 70%),
        radial-gradient(900px 600px at 50% 10%, #2A2170 0%, var(--marino) 65%);
      background-attachment: fixed;
      color: var(--blanco); min-height: 100svh; display: grid; place-items: center; padding: 40px 16px; text-align: center;
    }
    .caja { max-width: 560px; }
    .caja > * { animation: subir .8s cubic-bezier(.2,.7,.2,1) both; }
    .caja > :nth-child(2) { animation-delay: .12s; }
    .caja > :nth-child(3) { animation-delay: .2s; }
    .caja > :nth-child(4) { animation-delay: .3s; }
    .caja > :nth-child(5) { animation-delay: .4s; }
    @keyframes subir { from { opacity: 0; transform: translateY(22px); } }

    .encendida { position: relative; width: 110px; margin: 0 auto 28px; }
    .encendida svg { display: block; width: 100%; animation: latir 2.4s ease-in-out infinite; }
    @keyframes latir {
      0%, 100% { filter: drop-shadow(0 18px 34px rgba(140,82,232,.45)); transform: translateY(0); }
      50% { filter: drop-shadow(0 18px 50px rgba(169,124,255,.85)); transform: translateY(-4px); }
    }
    .encendida i {
      position: absolute; left: var(--x); top: 30%; width: 6px; height: 6px; border-radius: 50%; opacity: 0;
      background: var(--violeta-claro); box-shadow: 0 0 10px var(--violeta);
      animation: chispa 2.6s ease-out var(--t) infinite;
    }
    @keyframes chispa {
      0% { opacity: 0; transform: translate(0, 0) scale(1); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), -90px) scale(.3); }
    }

    h1 { font-size: clamp(32px, 6vw, 48px); margin-bottom: 16px; text-wrap: balance; }
    p { color: rgba(255,255,255,.78); font-size: 18px; margin-bottom: 14px; }

    /* Lista con doble marco */
    .marco {
      margin: 28px 0 32px; padding: 6px; border-radius: 26px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    }
    .pasos {
      text-align: left; border-radius: 20px; padding: 16px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 24px 44px -26px rgba(0,0,0,.7);
    }
    .pasos li { list-style: none; display: flex; align-items: center; gap: 14px; padding: 9px 0; color: rgba(255,255,255,.88); }
    .pasos li b {
      flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px;
      font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 15px; color: var(--blanco);
      background: linear-gradient(135deg, var(--azul), var(--violeta));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18), 0 8px 16px -8px rgba(140,82,232,.8);
    }
    .acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body class="grano">
  <main class="caja">
    <div class="encendida" aria-hidden="true">
      <svg viewBox="12 4 78 86"><defs><clipPath id="cb"><circle cx="42" cy="60" r="28"/></clipPath></defs><circle cx="42" cy="60" r="28" fill="#5A80FF"/><path d="M70 6 C 74 18 88 30 86 50 C 85 62 80 68 80 74 L 80 80 Q 80 88 70 88 Q 60 88 60 80 L 60 62 C 56 52 58 40 64 30 C 66 26 68 20 70 6 Z" fill="#A97CFF"/><path d="M70 6 C 74 18 88 30 86 50 C 85 62 80 68 80 74 L 80 80 Q 80 88 70 88 Q 60 88 60 80 L 60 62 C 56 52 58 40 64 30 C 66 26 68 20 70 6 Z" fill="#3A2AB0" clip-path="url(#cb)"/><path d="M71 42 C 74 49 79 53 78 61 C 77 67 73 71 70 71 C 66 71 64 67 65 62 C 66 56 70 51 71 42 Z" fill="#F1E8FF"/></svg>
      <i style="--x: 62%; --dx: -18px; --t: 0s"></i>
      <i style="--x: 74%; --dx: 14px; --t: .7s"></i>
      <i style="--x: 68%; --dx: 26px; --t: 1.3s"></i>
      <i style="--x: 80%; --dx: -6px; --t: 1.9s"></i>
    </div>
    <h1 class="titulo">¡Listo, ya me llegó!</h1>
    <p>Gracias por contarme de tu negocio. Ahora me pongo a trabajar en tu boceto.</p>
    <div class="marco">
      <ul class="pasos">
        <li><b>1</b> Reviso todo lo que me contaste.</li>
        <li><b>2</b> Armo un boceto de tu web.</li>
        <li><b>3</b> Te escribo por WhatsApp para mostrártelo.</li>
      </ul>
    </div>
    <div class="acciones">
      <a class="boton boton-principal" href="https://wa.me/5493434689400?text=Hola%20Azulado%20Estudio%2C%20reci%C3%A9n%20complet%C3%A9%20el%20cuestionario%20para%20mi%20web" target="_blank" rel="noopener">Avisarte por WhatsApp</a>
      <a class="boton boton-claro" href="index.html">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
